name: Build & push Novita image (split build)

# A GitHub-hosted runner has ~43 GB free; the finished image is ~55 GB.  So the
# image is built in independent parts (each <= ~25 GB), pushed to Docker Hub,
# then stitched back into one image at the registry by ops/compose-image.py.
#
# Required repository secrets: DOCKER_USER, DOCKER_PASS, HF_TOKEN

on:
  workflow_dispatch:
    inputs:
      parts:
        description: "JSON array of parts to build"
        default: '["env","h3diff-fl2va","h3diff-ref2va","h3enc","h3aux","seedvr2"]'
        required: true
      model_parts:
        description: "Comma-separated model parts, in final layer order"
        default: "h3diff-fl2va,h3diff-ref2va,h3enc,h3aux,seedvr2"
        required: true
      torch_index:
        description: "PyTorch CUDA index"
        default: "cu130"
        required: true
      install_sage:
        description: "Build SageAttention (1/0)"
        default: "1"
        required: true

permissions:
  contents: read

jobs:
  part:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(inputs.parts) }}
    steps:
      - uses: actions/checkout@v4

      - name: Show disk
        run: df -h /

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/go || true
          sudo rm -rf /usr/lib/jvm /usr/local/lib/node_modules /opt/hostedtoolcache/PyPy || true
          sudo rm -rf /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/node /usr/local/.ghcup || true
          sudo apt-get clean
          df -h /

      - name: Ensure podman
        run: |
          if ! command -v podman >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq podman; fi
          podman --version

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASS }}" | podman login docker.io -u "${{ secrets.DOCKER_USER }}" --password-stdin

      - name: Stage HF token
        run: |
          install -m 600 /dev/null /tmp/hf_token
          printf '%s' "${{ secrets.HF_TOKEN }}" > /tmp/hf_token

      - name: Pick Dockerfile
        id: pick
        run: |
          if [ "${{ matrix.part }}" = "env" ]; then
            echo "dockerfile=Dockerfile.env" >> "$GITHUB_OUTPUT"
          else
            echo "dockerfile=Dockerfile.models" >> "$GITHUB_OUTPUT"
          fi

      - name: Build part
        run: |
          set -euo pipefail
          PART="${{ matrix.part }}"
          IMAGE="docker.io/${{ secrets.DOCKER_USER }}/comfyui-h3-novita"
          podman build --format docker \
            --secret id=hf_token,src=/tmp/hf_token \
            --build-arg PART="${PART}" \
            --build-arg TORCH_INDEX="${{ inputs.torch_index }}" \
            --build-arg INSTALL_SAGE="${{ inputs.install_sage }}" \
            --build-arg SSH_AUTHORIZED_KEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIG6eQLbiJEo7wKVDj+1BswTpRJ2C8BU/hMFxhDYweS0n novita" \
            -t "${IMAGE}:part-${PART}" \
            -f "${{ steps.pick.outputs.dockerfile }}" .
          podman image inspect "${IMAGE}:part-${PART}" --format '{{.Size}} bytes'
          df -h /

      - name: Push part
        run: |
          set -euo pipefail
          podman push "docker.io/${{ secrets.DOCKER_USER }}/comfyui-h3-novita:part-${{ matrix.part }}"

      - name: Cleanup token
        if: always()
        run: rm -f /tmp/hf_token

  compose:
    needs: [part]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Compose final image at the registry
        env:
          MODEL_PARTS: ${{ inputs.model_parts }}
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
        run: |
          set -euo pipefail
          PARTS=""
          for p in $(echo "$MODEL_PARTS" | tr ',' ' '); do
            PARTS="${PARTS}${PARTS:+,}part-${p}"
          done
          echo "env=part-env parts=$PARTS"
          python3 ops/compose-image.py \
            --repo "${DOCKER_USER}/comfyui-h3-novita" \
            --env part-env \
            --parts "$PARTS" \
            --out latest

      - name: Verify the composed image on Docker Hub
        run: |
          set -euo pipefail
          curl -s --max-time 40 "https://hub.docker.com/v2/repositories/${{ secrets.DOCKER_USER }}/comfyui-h3-novita/tags?page_size=10" > /tmp/tags.json
          python3 -c "import json;d=json.load(open('/tmp/tags.json'));[print('  %-24s %.2f GB' % (t['name'], t.get('full_size',0)/1e9)) for t in d.get('results',[])]"
