name: Build & push ComfyUI images

# ONE codebase, TWO tags. The image decides for itself at boot; the tag decides the
# trade-off, and the operator picks the tag per platform.
#
#   :latest / :sha-<id>          code only, ~13 GB. SimplePod runs THIS: its hosts loop
#                                forever on our ~20 GB weight layers and never start.
#                                Weights are fetched from Hugging Face on first boot.
#   :models / :sha-<id>-models   weights baked in, ~83 GB. PPIO and Novita prewarm THIS,
#                                so their boots stay instant and offline.
#
# Both tags carry identical code, including build/fetch-models-boot.sh, which asks one
# question at boot: are the weights already on disk? Present -> return. Absent -> download.
# That is why no platform sniffing is needed -- the presence of the weights IS the signal.
#
# Two jobs, because a GitHub runner has ~43 GB free and the two variants together are
# ~96 GB. Each job gets its own runner; they run in parallel, which is also faster.
#
# Two repo NAMES are published as well, because the PPIO and Novita launchers ask for
# different ones. Both names get both tags.
#
# Required repository secrets: DOCKER_USER, DOCKER_PASS, HF_TOKEN (for the :models tag)

on:
  workflow_dispatch:
    inputs:
      torch_index:
        description: "PyTorch CUDA index"
        default: "cu130"
        required: true

permissions:
  contents: read

env:
  IMAGE_A: comfyui-h3-novita
  IMAGE_B: comfyui-qwen-novita

jobs:
  code-only:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Ensure podman
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq podman
          fi
          podman --version

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASS }}" | podman login docker.io -u "${{ secrets.DOCKER_USER }}" --password-stdin

      - name: Build code-only
        run: |
          set -euo pipefail
          IMAGE="docker.io/${{ secrets.DOCKER_USER }}/${{ env.IMAGE_A }}"
          podman build --format docker \
            --build-arg BAKED_MODELS=0 \
            --build-arg TORCH_INDEX="${{ inputs.torch_index }}" \
            --build-arg SSH_AUTHORIZED_KEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIG6eQLbiJEo7wKVDj+1BswTpRJ2C8BU/hMFxhDYweS0n novita" \
            -t "${IMAGE}:latest" \
            -f Dockerfile.env .
          podman image inspect "${IMAGE}:latest" --format 'code-only size {{.Size}} bytes'

      - name: Assert it carries no weights
        run: |
          set -euo pipefail
          IMAGE="docker.io/${{ secrets.DOCKER_USER }}/${{ env.IMAGE_A }}:latest"
          N=$(podman run --rm --entrypoint sh "$IMAGE" -c \
            "find /opt/ComfyUI/models -type f \( -name '*.safetensors' -o -name '*.gguf' \) -size +100M 2>/dev/null | wc -l" || echo 0)
          echo "large model files: $N"
          [ "$(echo "$N" | tr -d ' ')" = "0" ] || { echo "ERROR: :latest must be code-only"; exit 1; }
          podman run --rm --entrypoint sh "$IMAGE" -c \
            "ls -l /opt/fetch-models-boot.sh /opt/models-source.sh /opt/models-part.sh"
          echo "OK: code-only"

      - name: Push both repo names
        run: |
          set -euo pipefail
          BASE="docker.io/${{ secrets.DOCKER_USER }}/${{ env.IMAGE_A }}"
          ID=$(podman image inspect "${BASE}:latest" --format '{{.Id}}' | sed 's/^sha256://' | cut -c1-12)
          for REPO in "${{ env.IMAGE_A }}" "${{ env.IMAGE_B }}"; do
            for TAG in latest "sha-${ID}"; do
              podman tag "${BASE}:latest" "docker.io/${{ secrets.DOCKER_USER }}/${REPO}:${TAG}"
              podman push "docker.io/${{ secrets.DOCKER_USER }}/${REPO}:${TAG}"
            done
          done
          echo "### SIMPLEPOD / CODE-ONLY: sha-${ID}"

  with-models:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost /usr/share/swift /usr/lib/jvm || true
          sudo rm -rf /usr/local/lib/node_modules /usr/share/mysql /usr/share/postgresql || true
          sudo apt-get clean
          df -h /

      - name: Ensure podman
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq podman
          fi
          podman --version

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASS }}" | podman login docker.io -u "${{ secrets.DOCKER_USER }}" --password-stdin

      - name: Stage HF token
        run: |
          install -m 600 /dev/null /tmp/hf_token
          printf '%s' "${{ secrets.HF_TOKEN }}" > /tmp/hf_token

      - name: Build with weights baked in
        run: |
          set -euo pipefail
          IMAGE="docker.io/${{ secrets.DOCKER_USER }}/${{ env.IMAGE_A }}"
          podman build --format docker \
            --secret id=hf_token,src=/tmp/hf_token \
            --build-arg BAKED_MODELS=1 \
            --build-arg TORCH_INDEX="${{ inputs.torch_index }}" \
            --build-arg SSH_AUTHORIZED_KEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIG6eQLbiJEo7wKVDj+1BswTpRJ2C8BU/hMFxhDYweS0n novita" \
            -t "${IMAGE}:models" \
            -f Dockerfile.env .
          podman image inspect "${IMAGE}:models" --format 'with-models size {{.Size}} bytes'
          df -h /

      - name: Cleanup token
        if: always()
        run: rm -f /tmp/hf_token

      - name: Assert it carries the weights
        run: |
          set -euo pipefail
          IMAGE="docker.io/${{ secrets.DOCKER_USER }}/${{ env.IMAGE_A }}:models"
          N=$(podman run --rm --entrypoint sh "$IMAGE" -c \
            "find /opt/ComfyUI/models -type f \( -name '*.safetensors' -o -name '*.gguf' \) -size +100M 2>/dev/null | wc -l" || echo 0)
          echo "large model files: $N"
          [ "$(echo "$N" | tr -d ' ')" -gt 0 ] || { echo "ERROR: :models has no weights"; exit 1; }
          podman run --rm --entrypoint sh "$IMAGE" -c "du -sh /opt/ComfyUI/models"
          echo "OK: weights baked in"

      - name: Push both repo names
        run: |
          set -euo pipefail
          BASE="docker.io/${{ secrets.DOCKER_USER }}/${{ env.IMAGE_A }}"
          ID=$(podman image inspect "${BASE}:models" --format '{{.Id}}' | sed 's/^sha256://' | cut -c1-12)
          for REPO in "${{ env.IMAGE_A }}" "${{ env.IMAGE_B }}"; do
            for TAG in models "sha-${ID}-models"; do
              podman tag "${BASE}:models" "docker.io/${{ secrets.DOCKER_USER }}/${REPO}:${TAG}"
              podman push "docker.io/${{ secrets.DOCKER_USER }}/${REPO}:${TAG}"
            done
          done
          echo "### PPIO/NOVITA PREWARM: sha-${ID}-models"
