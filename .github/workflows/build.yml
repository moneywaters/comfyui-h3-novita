name: Build & push ComfyUI images

# TWO VARIANTS of the same codebase. The tag carries the trade-off; the image decides for
# itself at boot whether it already has the weights.
#
#   :latest / :sha-<id>          code only, ~13 GB. SimplePod runs THIS: its hosts loop
#                                forever on our ~20 GB weight layers and never start.
#                                Weights are fetched from Hugging Face on first boot.
#   :models / :sha-<id>-models   weights baked in, ~83 GB. PPIO and Novita prewarm THIS,
#                                so their boots stay instant and need no HF token.
#
# Both carry identical code including build/fetch-models-boot.sh, which asks one question:
# are the weights already on disk? Present -> return. Absent -> download. So no platform
# sniffing is needed -- the presence of the weights IS the signal.
#
# WHY THE WEIGHTS ARE BUILT AS SEPARATE PART IMAGES
# Baking all 8 parts into one image needs ~123 GB at peak on the build host: 43 GB of
# weights, plus podman taring the layer it is committing, plus the ~35 GB base. A GitHub
# runner has 110 GB free, so it dies with "no space left on device" while committing --
# measured, twice. Each part therefore gets its own image and its own runner, and
# ops/compose-image.py appends only the new layers onto the env image at the registry.
# No single runner ever holds more than one part.
#
# Two repo NAMES are published because the PPIO and Novita launchers ask for different
# ones; both names get both variants.
#
# Required repository secrets: DOCKER_USER, DOCKER_PASS, HF_TOKEN

on:
  workflow_dispatch:
    inputs:
      torch_index:
        description: "PyTorch CUDA index"
        default: "cu130"
        required: true

permissions:
  contents: read

env:
  IMAGE_A: comfyui-h3-novita
  IMAGE_B: comfyui-qwen-novita
  # Weights are streamed through `split` at this size so no docker layer is
  # large enough to break SimplePod. Its unpacker loops forever on the 20 GB
  # layers the plain :models tag has, while a 3.16 GB layer pulls fine.
  MODEL_CHUNK_MB: "2048"
  # PARTS is for the compose step; the matrix above lists the same parts inline,
  # because GitHub Actions does not allow env.* inside a matrix expression.
  PARTS: h3-fl2va,h3-singularity,h3enc,h3vae-kijai,h3vae-audio,h3loras,h3extra,seedvr2

jobs:
  # ---------------------------------------------------------------- code-only variant
  code-only:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Ensure podman
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq podman
          fi
          podman --version

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASS }}" | podman login docker.io -u "${{ secrets.DOCKER_USER }}" --password-stdin

      - name: Build code-only
        run: |
          set -euo pipefail
          IMAGE="docker.io/${{ secrets.DOCKER_USER }}/${{ env.IMAGE_A }}"
          podman build --format docker \
            --build-arg BAKED_MODELS=0 \
            --build-arg TORCH_INDEX="${{ inputs.torch_index }}" \
            --build-arg SSH_AUTHORIZED_KEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIG6eQLbiJEo7wKVDj+1BswTpRJ2C8BU/hMFxhDYweS0n novita" \
            -t "${IMAGE}:latest" \
            -f Dockerfile.env .
          podman image inspect "${IMAGE}:latest" --format 'code-only size {{.Size}} bytes'

      - name: Assert it carries no weights
        run: |
          set -euo pipefail
          IMAGE="docker.io/${{ secrets.DOCKER_USER }}/${{ env.IMAGE_A }}:latest"
          N=$(podman run --rm --entrypoint sh "$IMAGE" -c \
            "find /opt/ComfyUI/models -type f \( -name '*.safetensors' -o -name '*.gguf' \) -size +100M 2>/dev/null | wc -l" || echo 0)
          echo "large model files: $N"
          [ "$(echo "$N" | tr -d ' ')" = "0" ] || { echo "ERROR: :latest must be code-only"; exit 1; }
          podman run --rm --entrypoint sh "$IMAGE" -c \
            "ls -l /opt/fetch-models-boot.sh /opt/models-source.sh /opt/models-part.sh"
          echo "OK: code-only"

      - name: Push both repo names
        run: |
          set -euo pipefail
          BASE="docker.io/${{ secrets.DOCKER_USER }}/${{ env.IMAGE_A }}"
          ID=$(podman image inspect "${BASE}:latest" --format '{{.Id}}' | sed 's/^sha256://' | cut -c1-12)
          for REPO in "${{ env.IMAGE_A }}" "${{ env.IMAGE_B }}"; do
            for TAG in latest "sha-${ID}"; do
              podman tag "${BASE}:latest" "docker.io/${{ secrets.DOCKER_USER }}/${REPO}:${TAG}"
              podman push "docker.io/${{ secrets.DOCKER_USER }}/${REPO}:${TAG}"
            done
          done
          echo "### SIMPLEPOD / CODE-ONLY: sha-${ID}"

  # ---------------------------------------------------------------- per-part weight images
  part:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        part: ["h3-fl2va", "h3-singularity", "h3enc", "h3vae-kijai", "h3vae-audio", "h3loras", "h3extra", "seedvr2"]
    steps:
      - uses: actions/checkout@v4

      - name: Ensure podman
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq podman
          fi
          podman --version

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASS }}" | podman login docker.io -u "${{ secrets.DOCKER_USER }}" --password-stdin

      - name: Stage HF token
        run: |
          install -m 600 /dev/null /tmp/hf_token
          printf '%s' "${{ secrets.HF_TOKEN }}" > /tmp/hf_token

      # One RUN per chunk. Docker creates a layer per RUN instruction, not per file, so
      # splitting inside a single RUN leaves one 20.96 GB layer -- which is exactly what
      # the first attempt did and why SimplePod still looped.
      - name: Generate the chunked Dockerfile
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_TOKEN_FILE: /tmp/hf_token
        run: |
          set -euo pipefail
          python3 ops/gen-chunk-dockerfile.py \
            --part "${{ matrix.part }}" \
            --chunk-mb "${{ env.MODEL_CHUNK_MB }}" \
            --out Dockerfile.gen
          echo "### RUN instructions: $(grep -c '^RUN' Dockerfile.gen)"
          # `| head` closes the pipe early, so grep dies of SIGPIPE and, under pipefail,
          # fails the step even though the generator succeeded. Purely cosmetic output.
          grep -E '^FROM|^COPY|^RUN' Dockerfile.gen | head -8 || true

      - name: Build this part
        run: |
          set -euo pipefail
          IMAGE="docker.io/${{ secrets.DOCKER_USER }}/${{ env.IMAGE_A }}"
          podman build --format docker \
            --secret id=hf_token,src=/tmp/hf_token \
            -t "${IMAGE}:part-${{ matrix.part }}" \
            -f Dockerfile.gen .
          podman image inspect "${IMAGE}:part-${{ matrix.part }}" --format 'size {{.Size}} bytes'
          df -h /

      - name: Push this part
        run: |
          set -euo pipefail
          podman push "docker.io/${{ secrets.DOCKER_USER }}/${{ env.IMAGE_A }}:part-${{ matrix.part }}"

      - name: Cleanup token
        if: always()
        run: rm -f /tmp/hf_token

  # ---------------------------------------------------------------- compose + publish
  publish:
    needs: [code-only, part]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASS }}" | podman login docker.io -u "${{ secrets.DOCKER_USER }}" --password-stdin || true

      - name: Compose the with-weights variant
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASS }}
        run: |
          set -euo pipefail
          prefix() { local out=""; for p in $(echo "$1" | tr ',' ' '); do out="${out}${out:+,}part-${p}"; done; echo "$out"; }

          echo "### composing ${IMAGE_A}:models from part-* images"
          python3 ops/compose-image.py --repo "${DOCKER_USER}/${IMAGE_A}" \
            --env part-env --parts "$(prefix "$PARTS")" --out models --no-latest

          # Image B is the same layers under a different name, because the PPIO and
          # Novita launchers ask for comfyui-qwen-novita when a Qwen run is wanted.
          #
          # --no-latest on both: the code-only job owns :latest, and the with-weights
          # compose runs afterwards, so publishing :latest here would clobber it.
          #
          # Compose it the SAME way -- from the part images -- rather than pulling the
          # finished 78 GB image and re-pushing it. A pull needs 78 GB of local disk and
          # does not fit on the runner (measured: "no space left on device" writing
          # fl2va). compose-image.py only writes manifests and references blobs that are
          # already in the registry, so it costs a few KB.
          echo "### composing ${IMAGE_B}:models from the same part images"
          python3 ops/compose-image.py --repo "${DOCKER_USER}/${IMAGE_B}" \
            --parts-repo "${DOCKER_USER}/${IMAGE_A}" \
            --env part-env --parts "$(prefix "$PARTS")" --out models --no-latest

      # The chunked variant. :models keeps the 20/15/7 GB weight layers for PPIO and
      # Novita, which pull those fine; this tag has the same weights split into 2 GB
      # pieces so SimplePod can unpack them at all. start.sh stitches them back at boot.
      - name: Compose the chunked variant
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASS }}
        run: |
          set -euo pipefail
          prefix() { local out=""; for p in $(echo "$1" | tr ',' ' '); do out="${out}${out:+,}part-${p}"; done; echo "$out"; }
          for REPO in "${{ env.IMAGE_A }}" "${{ env.IMAGE_B }}"; do
            echo "### composing ${REPO}:models-chunked"
            python3 ops/compose-image.py --repo "${DOCKER_USER}/${REPO}" \
              --parts-repo "${DOCKER_USER}/${{ env.IMAGE_A }}" \
              --env latest --parts "$(prefix "$PARTS")" --out models-chunked --no-latest
          done

      # The whole point of this build: prove no layer is large enough to break SimplePod.
      # If chunking silently failed the 20 GB layer is still there, and this fails the job
      # rather than shipping an image that loops forever.
      - name: Assert no oversized layer
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
        run: |
          set -euo pipefail
          LIMIT_BYTES=4294967296 python3 ops/assert-layers.py \
            "${{ secrets.DOCKER_USER }}/${{ env.IMAGE_A }}:models-chunked" \
            "${{ secrets.DOCKER_USER }}/${{ env.IMAGE_B }}:models-chunked"

      - name: Report the content tags
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
        run: |
          set -euo pipefail
          python3 ops/check-sizes.py "${DOCKER_USER}/${IMAGE_A}" "${DOCKER_USER}/${IMAGE_B}" || true
          echo "### PPIO/NOVITA PREWARM: ${IMAGE_A}:models"
