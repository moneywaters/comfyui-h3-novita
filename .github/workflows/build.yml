name: Build & push Novita images (split build)

# A GitHub-hosted runner has ~43 GB free, so each image is built in independent
# parts (each <= ~25 GB), pushed to Docker Hub, then stitched back into one image
# at the registry by ops/compose-image.py.
#
# Produces two images, because Novita caps a prewarm at 100 GB per image:
#   moneywaters/comfyui-h3-novita     ~86 GB  H3 video generation (Seed Hunter v2.5.1)
#   moneywaters/comfyui-qwen-novita   ~49 GB  Qwen 2.1 image editing (+ spare H3 variants)
#
# Required repository secrets: DOCKER_USER, DOCKER_PASS, HF_TOKEN

on:
  workflow_dispatch:
    inputs:
      parts:
        description: "JSON array of parts to build"
        default: '["env","h3-fl2va","h3-singularity","h3enc","h3vae-kijai","h3vae-fp16","h3vae-audio","h3loras","h3extra","seedvr2","h3-ref2va-org","qwen-diff","qwen-enc","qwen-vae","qwen-loras"]'
        required: true
      torch_index:
        description: "PyTorch CUDA index"
        default: "cu130"
        required: true

permissions:
  contents: read

env:
  IMAGE_A: comfyui-h3-novita
  IMAGE_B: comfyui-qwen-novita
  PARTS_A: h3-fl2va,h3-singularity,h3enc,h3vae-kijai,h3vae-fp16,h3vae-audio,h3loras,h3extra,seedvr2
  PARTS_B: qwen-diff,qwen-enc,qwen-vae,qwen-loras,h3-ref2va-org

jobs:
  part:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(inputs.parts) }}
    steps:
      - uses: actions/checkout@v4

      - name: Show disk
        run: df -h /

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/go || true
          sudo rm -rf /usr/lib/jvm /usr/local/lib/node_modules /opt/hostedtoolcache/PyPy || true
          sudo rm -rf /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/node /usr/local/.ghcup || true
          sudo rm -rf /usr/share/mysql /usr/share/postgresql /opt/hostedtoolcache || true
          sudo apt-get clean
          df -h /

      - name: Ensure podman
        run: |
          if ! command -v podman >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq podman; fi
          podman --version

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASS }}" | podman login docker.io -u "${{ secrets.DOCKER_USER }}" --password-stdin

      - name: Stage HF token
        run: |
          install -m 600 /dev/null /tmp/hf_token
          printf '%s' "${{ secrets.HF_TOKEN }}" > /tmp/hf_token

      - name: Pick Dockerfile
        id: pick
        run: |
          if [ "${{ matrix.part }}" = "env" ]; then
            echo "dockerfile=Dockerfile.env" >> "$GITHUB_OUTPUT"
          else
            echo "dockerfile=Dockerfile.models" >> "$GITHUB_OUTPUT"
          fi

      - name: Build part
        run: |
          set -euo pipefail
          PART="${{ matrix.part }}"
          IMAGE="docker.io/${{ secrets.DOCKER_USER }}/${{ env.IMAGE_A }}"
          podman build --format docker \
            --secret id=hf_token,src=/tmp/hf_token \
            --build-arg PART="${PART}" \
            --build-arg TORCH_INDEX="${{ inputs.torch_index }}" \
            --build-arg SSH_AUTHORIZED_KEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIG6eQLbiJEo7wKVDj+1BswTpRJ2C8BU/hMFxhDYweS0n novita" \
            -t "${IMAGE}:part-${PART}" \
            -f "${{ steps.pick.outputs.dockerfile }}" .
          podman image inspect "${IMAGE}:part-${PART}" --format '{{.Size}} bytes'
          df -h /

      - name: Push part
        run: |
          set -euo pipefail
          podman push "docker.io/${{ secrets.DOCKER_USER }}/${{ env.IMAGE_A }}:part-${{ matrix.part }}"

      - name: Cleanup token
        if: always()
        run: rm -f /tmp/hf_token

  compose:
    needs: [part]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Compose both images at the registry
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASS }}
        run: |
          set -euo pipefail
          prefix() { local out=""; for p in $(echo "$1" | tr ',' ' '); do out="${out}${out:+,}part-${p}"; done; echo "$out"; }

          echo "### image A: ${IMAGE_A} (H3 video)"
          python3 ops/compose-image.py --repo "${DOCKER_USER}/${IMAGE_A}" \
            --env part-env --parts "$(prefix "$PARTS_A")" --out latest

          echo "### image B: ${IMAGE_B} (Qwen 2.1)"
          python3 ops/compose-image.py --repo "${DOCKER_USER}/${IMAGE_B}" \
            --env part-env --parts "$(prefix "$PARTS_B")" --out latest

      - name: Verify sizes are under the 100 GB prewarm cap
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
        run: |
          set -euo pipefail
          python3 ops/check-sizes.py \
            "${DOCKER_USER}/${IMAGE_A}" \
            "${DOCKER_USER}/${IMAGE_B}"
