name: Build & push ComfyUI images

# The images contain CODE ONLY -- no model weights. Weights are downloaded from Hugging
# Face on first boot by build/fetch-models-boot.sh.
#
# Why: our previous ~86 GB images carried ~62 GB of weights as single ~20 GB layers, and
# SimplePod's hosts would not unpack them -- their console looped "Preparing instance /
# Pulling image" forever while diskUsage stayed at 0.00, and the container never started.
# Reproduced on host 216 (RTX 4090) and host 161 (RTX 3090) at both 100 GB and 200 GB disk,
# while a 7 GB control image booted on those same hosts in ~300 seconds.
#
# A code-only image pulls in a couple of minutes anywhere. The cost is that a fresh instance
# downloads weights once before its first generation; a container restart finds them on disk
# and does nothing.
#
# Two image names are published because the PPIO and Novita launchers ask for different
# ones. Both point at identical layers.
#
# Required repository secrets: DOCKER_USER, DOCKER_PASS
# HF_TOKEN is NOT needed by this workflow -- only at runtime, by the instance.

on:
  workflow_dispatch:
    inputs:
      torch_index:
        description: "PyTorch CUDA index"
        default: "cu130"
        required: true

permissions:
  contents: read

env:
  IMAGE_A: comfyui-h3-novita
  IMAGE_B: comfyui-qwen-novita

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Show disk
        run: df -h /

      - name: Ensure podman
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq podman
          fi
          podman --version

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASS }}" | podman login docker.io -u "${{ secrets.DOCKER_USER }}" --password-stdin

      - name: Build the image
        run: |
          set -euo pipefail
          IMAGE="docker.io/${{ secrets.DOCKER_USER }}/${{ env.IMAGE_A }}"
          podman build --format docker \
            --build-arg TORCH_INDEX="${{ inputs.torch_index }}" \
            --build-arg SSH_AUTHORIZED_KEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIG6eQLbiJEo7wKVDj+1BswTpRJ2C8BU/hMFxhDYweS0n novita" \
            -t "${IMAGE}:latest" \
            -f Dockerfile.env .
          podman image inspect "${IMAGE}:latest" --format 'size {{.Size}} bytes'
          df -h /

      - name: Assert the image carries no model weights
        # The whole design rests on this property. If a model COPY is ever re-added to
        # Dockerfile.env, the image silently returns to ~86 GB and SimplePod breaks again,
        # so fail loudly here rather than hearing about it from a customer.
        run: |
          set -euo pipefail
          IMAGE="docker.io/${{ secrets.DOCKER_USER }}/${{ env.IMAGE_A }}:latest"
          BIG=$(podman run --rm --entrypoint sh "$IMAGE" -c \
            "find /opt/ComfyUI/models -type f \( -name '*.safetensors' -o -name '*.gguf' \) -size +100M 2>/dev/null | head -5" || true)
          if [ -n "$BIG" ]; then
            echo "ERROR: image contains model weights; it must be code-only:"
            echo "$BIG"
            exit 1
          fi
          echo "OK: no model weights baked into the image"
          podman run --rm --entrypoint sh "$IMAGE" -c \
            "du -sh /opt/ComfyUI/models 2>/dev/null; ls /opt/ComfyUI/models"
          podman run --rm --entrypoint sh "$IMAGE" -c \
            "ls -l /opt/fetch-models-boot.sh /opt/models-source.sh /opt/models-part.sh"

      - name: Push both image names with a content tag
        run: |
          set -euo pipefail
          SRC="docker.io/${{ secrets.DOCKER_USER }}/${{ env.IMAGE_A }}:latest"

          # Content tag from the image ID, so a prewarm can never serve stale layers: any
          # layer change yields a new tag instead of re-pointing an existing one.
          ID=$(podman image inspect "$SRC" --format '{{.Id}}' | sed 's/^sha256://' | cut -c1-12)
          echo "content tag -> sha-${ID}"

          for REPO in "${{ env.IMAGE_A }}" "${{ env.IMAGE_B }}"; do
            for TAG in latest "sha-${ID}"; do
              podman tag "$SRC" "docker.io/${{ secrets.DOCKER_USER }}/${REPO}:${TAG}"
              podman push "docker.io/${{ secrets.DOCKER_USER }}/${REPO}:${TAG}"
            done
            echo "pushed ${REPO}:latest and :sha-${ID}"
          done

          echo "### USE FOR PREWARM: sha-${ID}"
