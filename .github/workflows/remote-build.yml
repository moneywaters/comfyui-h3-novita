name: Remote build & push (big-disk builder)

# GitHub-hosted runners only have ~43 GB free — not enough for a ~50 GB
# models-baked image. So Actions orchestrates the build on a big-disk builder
# host over SSH, using exactly the same Dockerfile / Podman toolchain.
#
# Required repository secrets:
#   BUILDER_HOST      public hostname/IP of the builder
#   BUILDER_PORT      SSH port of the builder
#   BUILDER_SSH_KEY   private key authorised on the builder
#   DOCKER_USER / DOCKER_PASS / HF_TOKEN

on:
  workflow_dispatch:
    inputs:
      model_set:
        description: "Model set: video (H3+SeedVR2) or all"
        default: "video"
        required: true
      torch_index:
        description: "PyTorch CUDA index (cu130 / cu128 / cu126)"
        default: "cu130"
        required: true
      install_sage:
        description: "Build SageAttention (1/0)"
        default: "1"
        required: true

jobs:
  remote-build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Configure SSH to the builder
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.BUILDER_SSH_KEY }}" > ~/.ssh/builder
          chmod 600 ~/.ssh/builder
          ssh-keyscan -p "${{ secrets.BUILDER_PORT }}" "${{ secrets.BUILDER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Build and push the image on the builder
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/builder \
              -p "${{ secrets.BUILDER_PORT }}" \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              root@"${{ secrets.BUILDER_HOST }}" \
              "HF_TOKEN='${{ secrets.HF_TOKEN }}' \
               DOCKER_USER='${{ secrets.DOCKER_USER }}' \
               DOCKER_PASS='${{ secrets.DOCKER_PASS }}' \
               MODEL_SET='${{ inputs.model_set }}' \
               TORCH_INDEX='${{ inputs.torch_index }}' \
               INSTALL_SAGE='${{ inputs.install_sage }}' \
               bash -s" < ops/remote-build.sh

      - name: Confirm the image is on Docker Hub
        run: |
          curl -s --max-time 30 \
            "https://hub.docker.com/v2/repositories/${{ secrets.DOCKER_USER }}/comfyui-h3-novita/tags?page_size=5" \
            | python3 -c "import json,sys;d=json.load(sys.stdin);[print(' tag:',t['name'],t.get('full_size')) for t in d.get('results',[])]"
