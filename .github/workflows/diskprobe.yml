name: Disk probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Raw disk layout
        run: |
          echo "===== df -h ====="; df -h
          echo "===== lsblk ====="; lsblk -o NAME,SIZE,FSTYPE,MOUNTPOINT
          echo "===== free ====="; free -h
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/go || true
          sudo rm -rf /usr/lib/jvm /usr/local/lib/node_modules /opt/hostedtoolcache/PyPy || true
          sudo rm -rf /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/node /usr/local/.ghcup || true
          sudo apt-get clean
          echo "===== df -h after cleanup ====="; df -h
      - name: Can we use /mnt?
        run: |
          echo "--- /mnt ---"; ls -la /mnt 2>/dev/null | head
          df -h /mnt 2>/dev/null
          echo "--- write test 25GB sparse to /mnt ---"
          if dd if=/dev/zero of=/mnt/__sparse bs=1 count=0 seek=25G 2>/dev/null; then
            echo "sparse create ok"; df -h /mnt; rm -f /mnt/__sparse
          else
            echo "cannot use /mnt"
          fi
          echo "--- writable big dirs ---"
          for d in /mnt /home/runner /tmp /var/tmp; do
            printf '%s: ' "$d"; df -h "$d" 2>/dev/null | tail -1
          done
