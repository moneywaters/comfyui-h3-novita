name: Test pre-warmed image on a GPU instance

# Verifies an instance booted from the pre-warmed image: GPU visible, sshd up,
# ComfyUI up, every baked model resolvable, and a real MiniMax H3 text-to-video
# generation that lands a video file on disk.
#
# Required repository secrets: INSTANCE_SSH_KEY

on:
  workflow_dispatch:
    inputs:
      host:
        description: "Instance public IP"
        required: true
      port:
        description: "Instance SSH port"
        required: true
      user:
        description: "SSH user"
        default: "root"
        required: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.INSTANCE_SSH_KEY }}" > ~/.ssh/inst
          chmod 600 ~/.ssh/inst

      - name: Run the instance verification
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/inst \
              -p "${{ inputs.port }}" \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=120 \
              "${{ inputs.user }}@${{ inputs.host }}" \
              "bash -s" < ops/test-instance.sh
